# Production override: HTTPS for zerodayctf.com
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Certificates (Let's Encrypt) are expected at ./.data/certbot/conf/live/zerodayctf.com/
services:
  nginx:
    volumes:
      - ./conf/nginx/https.conf:/etc/nginx/nginx.conf:ro
      - ./.data/certbot/conf:/etc/letsencrypt:ro
      - ./.data/certbot/www:/var/www/certbot:ro
    ports:
      - 80:80
      - 443:443

  certbot:
    image: certbot/certbot
    volumes:
      - ./.data/certbot/conf:/etc/letsencrypt
      - ./.data/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
