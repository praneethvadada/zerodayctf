{% extends "base.html" %}

{% block content %}
  <div class="jumbotron">
    <div class="container">
      <h1>Verify your email</h1>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-6 offset-md-3">
        {% include "components/errors.html" %}
        <p>We sent a 6-digit code to <b>{{ email }}</b>. It is valid for 10 minutes. Check your spam folder if you do not see it.</p>

        <form method="post" accept-charset="utf-8" role="form">
          <input type="hidden" name="nonce" value="{{ Session.nonce }}">
          <div class="mb-3">
            <b><label class="form-label" for="code">Verification code</label></b>
            <input class="form-control" id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" autofocus required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Verify and create my account</button>
        </form>

        <form method="post" class="mt-3 text-center">
          <input type="hidden" name="nonce" value="{{ Session.nonce }}">
          <input type="hidden" name="action" value="resend">
          <button type="submit" class="btn btn-link">Send a new code{% if wait %} (available in {{ wait }}s){% endif %}</button>
        </form>
        <p class="text-center"><a href="{{ url_for('auth.register') }}">Wrong email? Start again</a></p>
      </div>
    </div>
  </div>
{% endblock %}
