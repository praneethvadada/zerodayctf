# Use AWS RDS instead of the bundled MariaDB container.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.rds.yml up -d --build
#
# Requires DATABASE_URL in .env, for example:
#   DATABASE_URL=mysql+pymysql://ctfd:PASSWORD@zerodayctf.xxxxxx.ap-south-1.rds.amazonaws.com:3306/ctfd?ssl_ca=/etc/ssl/rds/global-bundle.pem&ssl_verify_cert=true&ssl_verify_identity=true
services:
  ctfd:
    volumes:
      - ./.data/rds/global-bundle.pem:/etc/ssl/rds/global-bundle.pem:ro
    # the local database container is not used with RDS
    depends_on: !override
      permissions:
        condition: service_completed_successfully
      cache:
        condition: service_started

  db:
    profiles: ["localdb"]
