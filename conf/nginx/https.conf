worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream app_servers {
    server ctfd:8000;
  }

  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # Plain HTTP: ACME challenges and redirect to HTTPS
  server {
    listen 80;
    server_name zerodayctf.com www.zerodayctf.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://www.zerodayctf.com$request_uri;
    }
  }

  # Apex domain -> canonical www host
  server {
    listen 443 ssl;
    http2 on;
    server_name zerodayctf.com;
    ssl_certificate /etc/letsencrypt/live/zerodayctf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodayctf.com/privkey.pem;
    return 301 https://www.zerodayctf.com$request_uri;
  }

  # Canonical site
  server {
    listen 443 ssl;
    http2 on;
    server_name www.zerodayctf.com;

    ssl_certificate /etc/letsencrypt/live/zerodayctf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodayctf.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 100M;

    # Do not publish the API specification
    location = /api/v1/swagger.json { return 404; }

    # Server-sent events for notifications
    location /events {
      proxy_pass http://app_servers;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Prefix "";
    }

    location / {
      proxy_pass http://app_servers;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Prefix "";
    }
  }
}
