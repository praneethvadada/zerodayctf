worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
  multi_accept on;
}

http {
  upstream app_servers {
    server ctfd:8000;
    keepalive 512;
    keepalive_requests 10000;
    keepalive_timeout 75s;
  }

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # access log with timings: rt = total seconds nginx spent on the request, urt = seconds the app took
  log_format timed '$remote_addr "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout timed;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

  # The admin host gets a search-engine block header (empty value = header not sent on the main site)
  map $host $robots_header {
    default "";
    admin.zerodayctf.com "noindex, nofollow";
  }

  # Plain HTTP: ACME challenges and redirect to HTTPS
  server {
    listen 80;
    server_name zerodayctf.com www.zerodayctf.com admin.zerodayctf.com www.admin.zerodayctf.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      if ($host ~ ^(www\.)?admin\.) { return 301 https://admin.zerodayctf.com$request_uri; }
      return 301 https://www.zerodayctf.com$request_uri;
    }
  }

  # Apex domain -> canonical www host
  server {
    listen 443 ssl;
    http2 on;
    server_name zerodayctf.com;
    ssl_certificate /etc/letsencrypt/live/zerodayctf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodayctf.com/privkey.pem;
    return 301 https://www.zerodayctf.com$request_uri;
  }

  # www.admin -> admin
  server {
    listen 443 ssl;
    http2 on;
    server_name www.admin.zerodayctf.com;
    ssl_certificate /etc/letsencrypt/live/zerodayctf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodayctf.com/privkey.pem;
    return 301 https://admin.zerodayctf.com$request_uri;
  }

  # Canonical site (www) and the admin host share one application; the admin host opens straight at /admin
  server {
    listen 443 ssl;
    http2 on;
    server_name www.zerodayctf.com admin.zerodayctf.com;

    ssl_certificate /etc/letsencrypt/live/zerodayctf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zerodayctf.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag $robots_header always;

    # admin host: the bare address goes to the admin panel
    location = / {
      if ($host = admin.zerodayctf.com) { return 302 /admin; }
      proxy_pass http://app_servers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Prefix "";
    }

    # OPTIONAL, once admin.zerodayctf.com works: hide the admin panel on the public www host.
    # (Uncomment, then `docker compose restart nginx`.) To also restrict admin to your own IP, add
    #   allow YOUR.IP.ADDRESS; deny all;
    # inside a `location ^~ /admin` block that is only reached by the admin host.
    #   location ^~ /admin { if ($host != admin.zerodayctf.com) { return 404; } proxy_pass http://app_servers; ...same proxy lines as "location /"... }

    client_max_body_size 100M;

    # Do not publish the API specification
    location = /api/v1/swagger.json { return 404; }

    # Static theme files (CSS, JS, images, fonts) are served by nginx itself: no app worker is needed for them.
    # Compiled assets have content-hash names, so they can be cached forever.
    location ~ ^/themes/([^/]+)/static/assets/(.*)$ {
      alias /opt/themes/$1/static/assets/$2;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      access_log off;
    }
    location ~ ^/themes/([^/]+)/static/(webfonts|sounds)/(.*)$ {
      alias /opt/themes/$1/static/$2/$3;
      add_header Cache-Control "public, max-age=604800";
      add_header X-Content-Type-Options "nosniff" always;
      access_log off;
    }
    # everything else (brand CSS/JS/images) is revalidated each time so edits show up (cheap 304 answers)
    location ~ ^/themes/([^/]+)/static/(.*)$ {
      alias /opt/themes/$1/static/$2;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options "nosniff" always;
      access_log off;
    }

    # Server-sent events for notifications
    location /events {
      proxy_pass http://app_servers;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding off;
      proxy_buffering off;
      proxy_cache off;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Prefix "";
    }

    location / {
      proxy_pass http://app_servers;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $server_name;
      proxy_set_header X-Forwarded-Prefix "";
    }
  }
}
